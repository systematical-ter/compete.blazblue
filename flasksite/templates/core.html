<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="{{ url_for('static',filename='styles/output.css') }}" rel="stylesheet">
  {% block head %}{% endblock head %}
</head>
<body class="flex flex-col items-center bg-dark">
<div id="div-body" class="flex flex-col w-5xl items-center min-h-screen">
  <div id="div-header" class="w-4xl p-4
                             bg-middle 
                             border border-accent 
                             rounded-b-md
                             flex flex-row items-center gap-2">
    <div>
      LOGO
    </div>
    <div>
      Yay :)
    </div>
  </div>
  <div id="div-calendar" class="w-4xl">
    {% block calendar %}{% endblock %}
  </div>
  <div id="div-content" class="w-4xl">
    {% block info %}{% endblock %}
  </div>
</div>
</body>
</html>
